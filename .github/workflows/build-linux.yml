# Autobuild the Linux binary and upload it as an artifact.
#
# This reuses the project's own Dockerfile.wraithguard verbatim -- the tested
# Linux build -- rather than re-listing its apt/pip deps here (which would drift
# from it). The image installs the toolchain; the container runs PyInstaller
# against the checked-out source mounted at /src and writes dist/ back out.

name: Build Linux app

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write # create/attach to a Release on tag builds

# Surfaced here so the sign step's `if:` can test it -- `secrets` is not allowed
# in an `if:` expression, but `env` is.
env:
  MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}

concurrency:
  group: build-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build with the project's Dockerfile
        run: |
          docker build -f Dockerfile.wraithguard -t wraithguard-build .
          docker run --rm -v "${{ github.workspace }}:/src" wraithguard-build
          # PyInstaller wrote build/ and dist/ as root inside the container;
          # hand them back to the runner user so upload-artifact can read them.
          sudo chown -R "$(id -u):$(id -g)" build dist || true
          ls -lh dist/

      - name: Upload the Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: wraithguard-toolkit-linux-x86_64
          path: dist/wraithguard_toolkit_gui
          if-no-files-found: error
          retention-days: 14

      - name: Attach to the release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        run: cp dist/wraithguard_toolkit_gui dist/wraithguard-toolkit-linux-x86_64

      # Sign with minisign (pure-Python) so the download can be verified. Skipped,
      # not failed, when the signing secret is not configured yet.
      - name: Sign the binary (tag builds only)
        if: ${{ startsWith(github.ref, 'refs/tags/') && env.MINISIGN_SECRET_KEY != '' }}
        env:
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          python -m pip install py-minisign==0.21.1
          python tools/sign_release.py dist/wraithguard-toolkit-linux-x86_64

      - name: Publish the release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          # The .minisig line matches nothing when signing was skipped, so
          # fail_on_unmatched_files is off; the binary is always produced above.
          files: |
            dist/wraithguard-toolkit-linux-x86_64
            dist/wraithguard-toolkit-linux-x86_64.minisig
          fail_on_unmatched_files: false
          # This single-run job is the sole owner of the release notes: the Windows
          # and macOS build steps deliberately omit generate_release_notes because
          # they are matrixed and each set call appends another "Full Changelog"
          # block to the shared release. Keeping it here (and only here) yields one
          # changelog. If this job is ever matrixed, move note generation to a
          # dedicated release job so it still fires exactly once.
          generate_release_notes: true

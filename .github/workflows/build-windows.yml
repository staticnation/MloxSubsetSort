# Autobuild the Windows .exe (two variants) and upload them as artifacts.
#
# Two backends for pywebview's in-app viewer, so users can pick:
#   * edgechromium (default) -- small (~40 MB); uses the WebView2 runtime that
#     ships with Windows 10/11. This is what the local auto-py-to-exe build made.
#   * qt -- larger (~180 MB) but self-contained; bundles its own Qt WebEngine, so
#     it works on machines where WebView2 has been removed.
# Both are built from the same flags the old `.spec` used (the spec itself is a
# gitignored build artifact, no longer in the repo): a single-file windowed .exe,
# the .ico icon, and pythonnet/clr for the EdgeChromium backend.

name: Build Windows app

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write # create/attach to a Release on tag builds

# Exposed at workflow level so the sign step's `if:` can test whether the key is
# configured. The `secrets` context is NOT allowed in an `if:` expression, but
# `env` is -- so the secret is surfaced here and tested as `env.MINISIGN_SECRET_KEY`.
env:
  MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.backend }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: edgechromium # small; needs the WebView2 runtime on the target machine
            pip: pywebview==6.2.1
            platform: webview.platforms.edgechromium
            suffix: ""
            # No QtWebEngine on this leg -- PyQt6 isn't even installed.
            webengine_extra: ""
            # This leg IS the EdgeChromium backend, so no override -- let
            # pywebview pick its Windows default.
            runtime_hook_extra: ""
          - backend: qt # larger, self-contained; for machines without WebView2
            pip: pywebview[qt]==6.2.1
            platform: webview.platforms.qt
            suffix: "-qt"
            # pywebview's qt backend imports PyQt6.QtWebEngineWidgets inside a
            # try/except fallback (PyQt6, then PySide6) rather than a plain
            # top-level import, so PyInstaller's analyzer doesn't reliably
            # discover it through --hidden-import webview.platforms.qt alone.
            # Without this, the QWebEngineView widget gets created but
            # PyInstaller's PyQt6.QtWebEngineWidgets hook never runs, so the
            # helper process (Qt6WebEngineProcess.exe), its .pak resources,
            # translations, and generated qt.conf never get bundled -- the
            # view stays blank white with no renderer backing it, even with
            # GPU rendering forced off. --hidden-import guarantees the module
            # is seen; --collect-all is what actually pulls the hook's output in.
            webengine_extra: "--hidden-import PyQt6.QtWebEngineWidgets --collect-all PyQt6.QtWebEngineWidgets"
            # pywebview prefers EdgeChromium whenever clr/pythonnet imports, which
            # it does in this build too (the edgechromium stack is bundled). On a
            # WebView2-removed machine -- exactly who this -qt build is for -- it
            # would still pick edgechromium and render blank, never using Qt. This
            # runtime hook pins PYWEBVIEW_GUI=qt (and disables QtWebEngine's sandbox
            # for the --onefile temp extraction) before the app imports webview.
            runtime_hook_extra: "--runtime-hook packaging/pyi_rth_pywebview_qt.py"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependencies
        # ${{ matrix.pip }} is "pywebview" or "pywebview[qt]". The [qt] extra pulls
        # PyQt6 + QtWebEngine (~140 MB); without it pywebview uses the small
        # EdgeChromium backend via pythonnet/clr.
        # Deliberately no pillow/numpy: the shipped app imports neither (only the
        # tools/ scripts do). The local auto-py-to-exe build happened to have them
        # installed, so its bundle was ~20 MB heavier; leaving them out keeps the
        # .exe lean. tkinterweb can use PIL for image rendering, but it is only the
        # fallback viewer -- pywebview (EdgeChromium) is the primary and works
        # without it, as the 20 MB build confirmed.
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller "${{ matrix.pip }}" pythonnet==3.1.0 tkinterweb tkinterdnd2 PyYAML zstandard ijson certifi

      - name: Build the .exe
        # bash (present on Windows runners) keeps the multiline command readable;
        # PyInstaller still uses ';' as the --add-data separator on Windows. The
        # platform hidden import is per-variant (${{ matrix.platform }}) so
        # PyInstaller traces the right backend's runtime -- this is what the local
        # auto-py-to-exe build hinted (webview.platforms.edgechromium), and
        # getting it wrong is what produced a too-small, deps-missing .exe.
        # ${{ matrix.webengine_extra }} is empty on the edgechromium leg (that
        # line collapses to a no-op continuation) and forces in the QtWebEngine
        # hook's output on the qt leg -- see the matrix comment above.
        # ${{ matrix.runtime_hook_extra }} is likewise empty on edgechromium and,
        # on the qt leg, injects the runtime hook that pins pywebview to Qt.
        shell: bash
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --noupx \
            --name wraithguard_toolkit_gui \
            --icon wraithguard_toolkit_icon.ico \
            --collect-submodules wraithguard \
            --collect-all webview \
            --collect-all clr_loader \
            --collect-all pythonnet \
            --collect-all certifi \
            --hidden-import clr \
            --hidden-import ${{ matrix.platform }} \
            ${{ matrix.webengine_extra }} \
            ${{ matrix.runtime_hook_extra }} \
            --hidden-import tkinterweb \
            --exclude-module PySide6 \
            --exclude-module PySide2 \
            --exclude-module shiboken6 \
            --exclude-module PyQt6.QtQml \
            --exclude-module PyQt6.QtQuick \
            --exclude-module PyQt6.QtQuickWidgets \
            --exclude-module PyQt6.QtQuick3D \
            --exclude-module PyQt6.QtPositioning \
            --exclude-module PyQt6.QtDBus \
            --exclude-module PyQt6.QtMultimedia \
            --exclude-module PyQt6.QtSpatialAudio \
            --exclude-module PyQt6.QtTextToSpeech \
            --add-data "wraithguard_toolkit.py;." \
            --add-data "README.md;." \
            --add-data "QUICKSTART.md;." \
            --add-data "MLOX_RULES.md;." \
            --add-data "wraithguard_toolkit_icon.ico;." \
            --add-data "wraithguard/viz/assets;assets" \
            wraithguard_toolkit_gui.py
          mv "dist/wraithguard_toolkit_gui.exe" \
             "dist/wraithguard-toolkit-windows-x86_64${{ matrix.suffix }}.exe"

      - name: Upload the .exe
        uses: actions/upload-artifact@v4
        with:
          name: wraithguard-toolkit-windows-x86_64${{ matrix.suffix }}
          path: dist/wraithguard-toolkit-windows-x86_64${{ matrix.suffix }}.exe
          if-no-files-found: error
          retention-days: 14

      # Sign the artifact with minisign (pure-Python, no C/Rust toolchain) so the
      # download can be verified. Skipped, not failed, when the signing secret is
      # not configured yet, so a release can still go out unsigned during setup.
      - name: Sign the .exe (tag builds only)
        if: ${{ startsWith(github.ref, 'refs/tags/') && env.MINISIGN_SECRET_KEY != '' }}
        env:
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          python -m pip install py-minisign==0.21.1
          python tools/sign_release.py "dist/wraithguard-toolkit-windows-x86_64${{ matrix.suffix }}.exe"

      - name: Attach to the release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          # The .minisig line matches nothing when signing was skipped, so
          # fail_on_unmatched_files is off; the .exe is always produced by the
          # build step above (which fails the job if it is not).
          files: |
            dist/wraithguard-toolkit-windows-x86_64${{ matrix.suffix }}.exe
            dist/wraithguard-toolkit-windows-x86_64${{ matrix.suffix }}.exe.minisig
          fail_on_unmatched_files: false
          # No generate_release_notes here: this step runs once per matrix backend
          # (edgechromium + qt), and each softprops call with it set regenerates
          # and appends a "Full Changelog" block to the shared release. Exactly one
          # job owns the notes -- the single-run Linux build -- so the release gets
          # one changelog, not five. This step only uploads its .exe.

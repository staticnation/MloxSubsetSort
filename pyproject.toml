# Tooling configuration for Wraithguard Toolkit.
#
# The project ships as two entry-point scripts plus the wraithguard package,
# and is normally distributed as a PyInstaller binary rather than a wheel. This
# file pins tool behaviour and declares standards metadata. Run:
#     python -m ruff check .          # PEP 8 style, naming, import order
#     python -m black --check .       # formatting
#     python -m mypy                  # PEP 484 types (gates every file)
#     python -m pytest                # 3,202 tests

# --- PEP 518 / 517 build system ----------------------------------------------
# Required once [project] exists: PEP 518 makes this the declaration of what is
# needed to build, and PEP 517 the interface used to do it. Without it a tool
# has to guess, and the historical guess (setuptools, implicitly) is exactly
# what those PEPs were written to stop.
#
# The tool normally ships as scripts and a PyInstaller binary, so this is here
# for correctness and inspectability rather than because a wheel is published.
[build-system]
# >=77: first setuptools release supporting PEP 639 license expressions.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Explicit, because the flat layout puts two top-level modules beside the
# package and auto-discovery refuses to choose between them.
packages = [
    "wraithguard",
    "wraithguard.configurator",
    "wraithguard.esp",
    "wraithguard.gui",
    "wraithguard.images",
    "wraithguard.land",
    "wraithguard.mwscript",
    "wraithguard.net",
    "wraithguard.nif",
    "wraithguard.patch",
    "wraithguard.plugins",
    "wraithguard.rules",
    "wraithguard.sort",
    "wraithguard.tes3fields",
    "wraithguard.viz",
]
py-modules = ["wraithguard_toolkit", "wraithguard_toolkit_gui"]

[tool.setuptools.package-data]
wraithguard = ["py.typed"]
# The vendored three.js build and its licence. Data, not code, so it has to be
# named explicitly or a wheel would ship a viewer with no library in it.
"wraithguard.nif" = ["assets/*.cjs", "assets/*.txt"]

# --- PEP 621 project metadata ------------------------------------------------
# Declared even though the project ships as scripts and a compiled binary
# rather than a wheel: PEP 621 is the standard place for this information, and
# having it here means `python -m build`, dependency scanners and editors can
# all read the same answer. tests/test_standards.py asserts that `version`
# below and wraithguard.__version__ never drift apart.
[project]
name = "wraithguard-toolkit"
version = "4.0.0"
description = "Sort your own Morrowind mods into a frozen MOMW load order."
readme = "README.md"
requires-python = ">=3.10"
# PEP 639: an SPDX expression, not the deprecated table/classifier forms.
# The licence *text* still ships, via license-files.
license = "MIT"
license-files = ["License/LICENSE"]
keywords = ["morrowind", "openmw", "mlox", "momw", "load-order"]
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
    "Typing :: Typed",
]
# No install_requires: the tool runs on the standard library alone. The
# optional extras below each enable one feature and degrade gracefully.
dependencies = []

[project.optional-dependencies]
yaml = ["PyYAML"]          # faster plugin-order.yml parsing
dnd = ["tkinterdnd2"]       # drag-and-drop into the GUI
webview = ["pywebview"]     # in-app viewer, first choice: a real OS webview
html = ["tkinterweb"]       # in-app viewer, second choice: renders SVG, load_file
zstd = ["zstandard"]        # tes3conv bytecode on Python < 3.14
# Streaming JSON for the diff/patch reader. Without it the field-level readers
# fall back to a whole-file parse per plugin (same records, old peak memory);
# with it they stream and keep only the wanted records, so peak memory reading
# a few records out of a 600 MB landmass plugin drops from ~2 GB to tens of MB.
stream = ["ijson"]

# Everything the GUI can use. `pip install -e .[gui]` is the one command that
# leaves no viewer missing -- which is worth having as a single name, because
# the failure mode is silent: with none of these installed the app runs, writes
# its pages, and quietly opens them in the browser instead.
gui = ["PyYAML", "tkinterdnd2", "pywebview", "tkinterweb", "zstandard", "ijson"]

# The gates, pinned. `pip install -e .[dev]` installs the exact tool versions
# the standards claims in this file and in README/CODE_REVIEW are measured
# against. This exists because the empty runtime `dependencies` means nothing
# else pins the toolchain: ruff and mypy keep adding and stabilising rules, so
# an unpinned `python -m mypy` / `ruff check` drifts from "zero findings" to a
# pile of new-rule noise without a line of project code changing -- which is
# exactly what an audit found (ISC004, PLR0917, and a wave of typeshed
# type-var errors all appeared purely from newer tool releases). Bump these
# deliberately, re-run the gates, and adjust the ignore lists in the same
# commit -- never let them float.
#   types-PyYAML: stubs for the optional `yaml` import in wraithguard.momw, so
#   mypy types it instead of reporting import-untyped when PyYAML is present.
dev = [
    "ruff==0.16.1",
    "black==26.5.1",
    "mypy==2.3.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "types-PyYAML==6.0.12.20260724",
    # Installed in dev so the streaming diff/patch reader is exercised by the
    # suite rather than only its whole-file fallback.
    "ijson==3.5.1",
]

[project.scripts]
wraithguard = "wraithguard_toolkit:main"

[tool.ruff]
# The project ships as a compiled binary, so the interpreter is ours to
# choose: 3.10+ (zip(strict=), match, PEP 604 unions, itertools.pairwise).
target-version = "py310"
line-length = 100
# Vendored/reference third-party sources are read for format research, not
# maintained here -- linting them is noise.
extend-exclude = [
    "mlox-master", "plox-main", "openmw-master", "modorganizer-master",
    "tes3conv-master", "TES3Tool-master", "Tes3EditX-main", "modmapper-main",
    "momw-configurator-master", "TES3 Conflictsolver", "output",
    "tes3conv_json", "build",
]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "B",         # bugbear
    "C4",        # comprehensions
    "SIM",       # simplify
    "RET",       # return
    "PTH",       # pathlib
    "UP",        # pyupgrade
    "S",         # bandit (security)
    "PERF",      # performance
    "RUF",       # ruff-specific
    "PIE", "ISC", "ICN", "INT", "TID", "A", "PL",
    # Annotation-only imports belong under TYPE_CHECKING, so they are not paid
    # for at start-up. Safe here without exception because every module has
    # `from __future__ import annotations` (PEP 563), which makes every
    # annotation a string, and nothing in this project introspects annotations
    # at runtime -- checked: no get_type_hints, no __annotations__ reads.
    "TC",
    # Blind `except Exception`. This tool has a lot of genuinely defensive
    # catches -- optional imports, Tk quirks, untrusted downloaded rule files,
    # settings/trace persistence -- and they must stay broad. The rule is on
    # anyway so each one is a *documented* decision: every remaining site
    # carries a `# noqa: BLE001` stating why it cannot narrow, rather than
    # being an invisible blanket catch.
    "BLE",       # flake8-blind-except
    # Naive datetimes. Every timestamp in this tool is deliberately on the
    # LOCAL clock -- .bak filenames, trace lines, the build stamp and the
    # .pot header are all read by the user against their own clock, and UTC
    # would be actively wrong. The rule is on for the same reason BLE is:
    # so each of the 9 sites is a stated decision rather than an oversight.
    "DTZ",       # flake8-datetimez
    # PEP 257 docstrings and PEP 484 annotations. Enforced everywhere as of
    # 3.0 -- the legacy scripts' exemptions were paid off, not carried
    # forward (CODE_REVIEW.md §20).
    "D",         # pydocstyle (PEP 257)
    "ANN",       # flake8-annotations (PEP 484)
    "N",         # pep8-naming (PEP 8 naming conventions)
    "I",         # isort (PEP 8 import ordering)
]
ignore = [
    # --- Deliberate, reviewed exemptions -------------------------------------
    # Long descriptive strings (user-facing messages, embedded HTML/CSS for the
    # cell map) are clearer unwrapped than split across lines.
    "E501",
    # This is a CLI + GUI tool: print() IS the user interface.
    "T201",
    # Every zip() call site is either an intentional offset pairing --
    # zip(xs, xs[1:]) for consecutive pairs, where strict=True would raise on
    # every call -- or a comparison that reports length mismatch itself with a
    # better message than an exception. Reviewed individually, not blanket.
    "B905",
    # The trace/sort-trace log handles are deliberately long-lived: reopening
    # per line made the sort engine crawl once it started logging thousands of
    # steps. They are flushed per write and closed by set_trace_file().
    "SIM115",
    # Optional deps (tomli, yaml, tkinter extras) and heavy stdlib imports are
    # imported inside functions on purpose, so a missing optional dependency
    # degrades one feature instead of preventing startup.
    "PLC0415",
    # Cosmetic/never-critical failures (a tooltip that cannot render, a trace
    # line that cannot be written) are swallowed on purpose so they can never
    # take down a sort. The important paths report errors to the user.
    "S110", "S112", "SIM105",
    # Module-level trace state is a documented singleton for this script pair.
    "PLW0603",
    # Complexity limits: this is a domain tool whose sort/emit functions are
    # inherently long and sequential; splitting them purely to satisfy a
    # counter would hurt readability. PLR0917 (too-many-positional) is the same
    # family as PLR0913 (too-many-arguments), split into its own rule in a
    # later ruff; exempted for the same reason and to keep the two consistent.
    "PLR0911", "PLR0912", "PLR0913", "PLR0917", "PLR0915", "PLR2004",
    # Formatter-owned. ISC004 (unparenthesized implicit concatenation in a
    # collection) is the false-positive-prone sibling of ISC001: every site is
    # a long user-facing / HTML string deliberately wrapped across lines and
    # already parenthesized as a tuple element, so the "forgot a comma?"
    # heuristic is noise here. Stabilized after this config was written.
    "COM812", "ISC001", "ISC004",
]

[tool.ruff.lint.per-file-ignores]
# Tests: assert is the point, and fixtures reuse loop names freely.
# RUF012: test doubles use plain class-level lists as canned data; they are
# never shared across instances, so ClassVar annotations would be noise.

# The new wraithguard/ package is held to a stricter standard than the legacy
# scripts: full typing, PEP 257 docstrings with Args/Returns/Raises, and no
# silent excepts. New code goes here; see CODE_REVIEW.md for the migration plan.
"wraithguard/*" = []
# The tests keep their D/ANN exemption: assert is the point there, and
# docstrings on parametrised cases would be noise. Both shipped scripts now
# meet the full standard, so only their genuinely-specific exemptions remain.
"wraithguard_toolkit.py" = [
    # E402 only: the imports sit after the section comments that group and
    # explain them, which is what E402 objects to.
    #
    # F401 is deliberately NOT exempted any more. It used to be, because this
    # module re-exported 36 names purely so `core.<name>` resolved for the GUI
    # and the tests -- an unused import was the normal case here. Those callers
    # now import from wraithguard/ directly (CODE_REVIEW.md §23), so every
    # import left in this file is one the module actually uses, and an unused
    # import is a real finding again.
    "E402",
]
"wraithguard_toolkit_gui.py" = [
    # PERF203: per-widget try/except is idiomatic and necessary in Tk -- a
    # TclError on one widget (destroyed, or not supporting an option on this
    # platform) must not abort styling or populating all the others. Hoisting
    # the try out of the loop would make one bad widget blank the panel.
    "PERF203",
    # S603: every subprocess call here builds its own argument list from
    # sys.executable and paths this code constructed. No shell, no user string
    # interpolation.
    "S603",
]
"tests/*" = ["S101", "PLR2004", "ARG001", "RUF012", "D", "ANN"]
"tools/*" = ["ANN401"]
# --- Documented debt, not a blanket exemption ----------------------------
# These modules were relocated from the engine VERBATIM during the module
# split. Moving them and retyping them in one step would have made a
# behaviour change indistinguishable from a relocation error -- and this is
# the code that decides load order and rewrites openmw.cfg, so that
# distinction matters more than tidiness. Each is pinned by
# tests/test_differential.py, so the typing pass can be done safely and
# verifiably later; see CODE_REVIEW.md. Delete an entry when its module is
# annotated -- the list is meant to shrink to nothing.
# Generated from upstream reference tables -- style is the generator's business.
"wraithguard/mwscript/opcodes.py" = ["ALL"]
"wraithguard/tes3fields/schema.py" = ["ALL"]
# Generated by tools/gen_tes3_enums.py from tes3conv's vanilla output.
"wraithguard/patch/enum_data.py" = ["ALL"]
# Generated by tools/gen_tes3_fieldtypes.py from the tes3 crate.
"wraithguard/patch/field_types.py" = ["ALL"]
# Generated by tools/gen_esp_types.py from the tes3 crate's enums.rs/flags.rs.
"wraithguard/esp/enums.py" = ["ALL"]
"wraithguard/esp/flags.py" = ["ALL"]
# The GUI split (3.0, CODE_REVIEW.md §16/§9.2): these bodies moved VERBATIM
# out of wraithguard_toolkit_gui.py. The D/ANN debt they arrived with was paid
# off in the same release (§17): all four now meet the package's strict
# standard -- full annotations and PEP 257 docstrings -- so only the two
# genuinely Tk/subprocess-specific exemptions remain.
# PERF203: per-widget try/except is idiomatic and necessary in Tk -- a
# TclError on one widget must not abort styling all the others.
# S603: subprocess argv built from sys.executable and paths this code
# constructed; no shell, no user string interpolation.
"wraithguard/gui/theme.py" = ["PERF203"]
"wraithguard/gui/widgets.py" = ["PERF203"]
"wraithguard/gui/rtl.py" = ["PERF203"]
"wraithguard/gui/t3.py" = ["PERF203", "S603"]
"wraithguard/gui/conflicts.py" = ["PERF203", "S603"]

[tool.ruff.lint.isort]
# Keep `from x import (a as b, c as d)` in ONE block. Without this, isort
# splits every aliased import into its own statement, which both reads badly
# and detaches any trailing `# noqa` from the lines it was meant to cover.
combine-as-imports = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
# The codebase predates this config and uses single quotes in places where
# they read better (TOML/mlox literals). Formatting is not enforced in CI --
# see CONTRIBUTING notes in README before running a repo-wide reformat.
quote-style = "preserve"

[tool.black]
line-length = 100
target-version = ["py310"]
force-exclude = true
# opcodes.py is generated by tools/gen_opcodes.py; the generator owns its
# layout, so reformatting it would just be undone on the next regeneration.
extend-exclude = '''
/(mlox-master|plox-main|openmw-master|modorganizer-master|tes3conv-master
 |TES3Tool-master|Tes3EditX-main|modmapper-main|momw-configurator-master
 |output|tes3conv_json|build)/
 |wraithguard/mwscript/opcodes\.py
 |wraithguard/patch/enum_data\.py
 |wraithguard/patch/field_types\.py
 |wraithguard/esp/enums\.py
 |wraithguard/esp/flags\.py
'''

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true

# wraithguard/ is fully annotated and mypy-clean, so PEP 484 conformance is
# now CHECKED rather than assumed:
#     python -m mypy wraithguard/
# It found 22 real errors when first enabled -- every one of them in
# annotations that had been written by hand and never verified, including a
# `Sequence` that the body concatenated and an int-typed dict holding floats.
# A wrong type hint is worse than none, because it gets believed.
files = ["wraithguard", "wraithguard_toolkit.py", "wraithguard_toolkit_gui.py"]
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true

# No ignore_errors overrides remain: both legacy scripts were annotated in the
# typing pass (CODE_REVIEW.md §20) and are gated alongside the package. An
# entry here would now be a silent exemption rather than a documented gap.

# wraithguard.gui had an ignore_errors override while the relocated-verbatim
# GUI bodies were unannotated. The typing pass (§17) cleared it: the package
# is annotated and mypy-clean, so it is now gated like the rest of
# wraithguard/ -- the override is deliberately gone rather than left as a
# silent exemption. It needs Tk to import, which mypy does not require.

# --- coverage (CODE_REVIEW.md §8.5) ---------------------------------------
# Deliberately NOT wired into `addopts`. Plain `pytest` must keep working with
# nothing but pytest installed; coverage is opt-in via `pytest --cov`, which is
# what CI does. Putting `--cov` in addopts would make pytest-cov a hard
# requirement for every contributor to run the suite at all.
[tool.coverage.run]
source = ["wraithguard", "wraithguard_toolkit"]
branch = true
omit = [
    # The GUI cannot be imported without Tk, which the hermetic suite does not
    # have. Including it would report a meaningless ~0% and bury the number
    # that matters. Its coverage is the manual SMOKE_TEST.md run, and that is
    # stated rather than papered over. wraithguard/gui/ is the part of it that
    # moved into the package during the 3.0 split -- same Tk dependency, same
    # reasoning.
    "wraithguard_toolkit_gui.py",
    "wraithguard/gui/*",
    # Generated; style and coverage are the generator's problem.
    "*/opcodes.py",
    "*/tes3fields/schema.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    # Type-checking-only imports never execute at runtime (PEP 563 + 484).
    "if TYPE_CHECKING:",
    # Defensive re-raises and unreachable guards.
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
# The floor §8.5 asked for. Branch coverage, full suite, zstandard installed.
# First taken at 54% (3.0, §16 reconciliation) and floored at 52. Re-measured at
# 79.3% during the 3.1.2 audit, floored at 77; then the suite grew again (the
# dialogue decoder, xEdit colours, the cross-platform _records_via tests) and
# the honest number is now 93.4% with a real tes3conv, ~93.2% on CI without one
# (the full-merge tests are tes3conv-gated and skip there). Floored at 90 -- a
# few points below the CI number so it ratchets with coverage rather than
# blocking the next PR. Raise it as the number climbs; never lower it to pass.
fail_under = 90
